<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel API Proxy · 免费反向代理</title>
    <style>
        /* ---------- 主题变量（自动跟随系统深浅色） ---------- */
        :root {
            --bg: #ffffff;
            --fg: #171717;
            --muted: #666666;
            --border: #e5e5e5;
            --card: #ffffff;
            --btn-bg: #000000;
            --btn-fg: #ffffff;
            --btn-hover: rgba(0, 0, 0, 0.85);
            --accent: #0070f3;
            --accent-ring: rgba(0, 112, 243, 0.15);
            --error: #d33;
            --code-bg: #f6f6f6;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --fg: #ededed;
                --muted: #a1a1a1;
                --border: #303030;
                --card: #111111;
                --btn-bg: #ffffff;
                --btn-fg: #000000;
                --btn-hover: rgba(255, 255, 255, 0.85);
                --accent: #3790ff;
                --accent-ring: rgba(55, 144, 255, 0.2);
                --error: #ff6b6b;
                --code-bg: #1c1c1c;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.6), 0 8px 24px rgba(0, 0, 0, 0.5);
            }
        }

        /* ---------- 基础 ---------- */
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* 键盘焦点环（可访问性） */
        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ---------- 主区域 ---------- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            text-align: center;
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        h1 svg { width: 22px; height: 22px; }
        .subtitle {
            margin: 0 0 40px;
            color: var(--muted);
            font-size: 15px;
        }

        /* ---------- 输入卡片 ---------- */
        .card {
            width: 100%;
            max-width: 620px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            text-align: left;
        }
        .input-row { display: flex; gap: 10px; }
        #input {
            flex: 1;
            min-width: 0;
            height: 46px;
            padding: 0 14px;
            font-size: 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            color: var(--fg);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        #input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
            outline: none;
        }
        #submitBtn {
            height: 46px;
            padding: 0 22px;
            font-size: 15px;
            font-weight: 500;
            color: var(--btn-fg);
            background: var(--btn-bg);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        #submitBtn:hover { background: var(--btn-hover); }

        .error {
            margin: 10px 2px 0;
            color: var(--error);
            font-size: 13px;
        }

        /* ---------- 生成结果：两种模式同时展示 ---------- */
        .results {
            margin-top: 18px;
            display: grid;
            gap: 14px;
        }
        .result-label {
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12.5px;
        }
        .result-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .result-row code {
            flex: 1;
            min-width: 200px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--code-bg);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px;
            word-break: break-all;
            color: var(--fg);
        }
        .copyBtn {
            height: 34px;
            padding: 0 14px;
            font-size: 13px;
            color: var(--fg);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }
        .copyBtn:hover { border-color: var(--muted); }
        .openLink {
            height: 34px;
            line-height: 32px;
            padding: 0 14px;
            font-size: 13px;
            color: var(--fg);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .openLink:hover { border-color: var(--muted); }

        /* ---------- 用法提示 ---------- */
        .usage {
            width: 100%;
            max-width: 620px;
            margin-top: 28px;
            color: var(--muted);
            font-size: 13.5px;
            line-height: 2.2;
        }
        .usage code {
            padding: 2px 8px;
            border-radius: 6px;
            background: var(--code-bg);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px;
        }

        /* ---------- 页脚 ---------- */
        footer {
            display: flex;
            justify-content: center;
            gap: 28px;
            padding: 20px;
            border-top: 1px solid var(--border);
            font-size: 13.5px;
        }
        footer a { color: var(--muted); text-decoration: none; }
        footer a:hover { color: var(--fg); }

        /* ---------- 手机适配 ---------- */
        @media (max-width: 520px) {
            h1 { font-size: 22px; }
            .card { padding: 18px; }
            .input-row { flex-direction: column; }
            #submitBtn { width: 100%; }
            .result-row code { min-width: 100%; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 3 22 20H2Z" />
                </svg>
                Vercel API Proxy
            </h1>
            <p class="subtitle">免费反向代理 · 部署到 Vercel 即可使用</p>
        </header>

        <form class="card" id="proxyForm">
            <div class="input-row">
                <input type="text" id="input" name="domainname"
                       placeholder="请输入完整 URL，如 https://api.openai.com/v1"
                       autocomplete="off" spellcheck="false">
                <button type="submit" id="submitBtn">生成</button>
            </div>
            <p class="error" id="errorMsg" hidden></p>

            <div class="results" id="results" hidden>
                <div class="result">
                    <div class="result-label">直转模式 —— API 调用 / 大文件下载</div>
                    <div class="result-row">
                        <code id="directLink"></code>
                        <button type="button" class="copyBtn" data-target="directLink">复制</button>
                        <a class="openLink" id="directOpen" target="_blank" rel="noopener">打开 ↗</a>
                    </div>
                </div>
                <div class="result">
                    <div class="result-label">增强模式 —— 跟随 3xx 跳转 / 浏览器跨域（CORS）</div>
                    <div class="result-row">
                        <code id="enhancedLink"></code>
                        <button type="button" class="copyBtn" data-target="enhancedLink">复制</button>
                        <a class="openLink" id="enhancedOpen" target="_blank" rel="noopener">打开 ↗</a>
                    </div>
                </div>
            </div>
        </form>

        <div class="usage">
            也可以直接在任何 URL 前加前缀使用：<br>
            直转模式&nbsp;&nbsp;<code>你的域名/https/目标URL</code><br>
            增强模式&nbsp;&nbsp;<code>你的域名/api/proxy/https/目标URL</code>
        </div>
    </main>

    <footer>
        <a href="https://vercel.com" target="_blank" rel="noopener">Powered by Vercel</a>
        <a href="https://github.com/TrueHOOHA/vercel-api-proxy" target="_blank" rel="noopener">GitHub</a>
    </footer>

    <script>
        const input = document.getElementById('input');
        const errorMsg = document.getElementById('errorMsg');
        const form = document.getElementById('proxyForm');
        const results = document.getElementById('results');
        const directLink = document.getElementById('directLink');
        const enhancedLink = document.getElementById('enhancedLink');
        const directOpen = document.getElementById('directOpen');
        const enhancedOpen = document.getElementById('enhancedOpen');

        // 校验：完整 URL，必须带 http(s):// 前缀（大小写均可）
        const URL_RE = /^(https?):\/\/\S+$/i;

        function generate(showError) {
            const inputVal = input.value.trim();

            if (!URL_RE.test(inputVal)) {
                if (showError) {
                    errorMsg.textContent = '请输入以 http:// 或 https:// 开头的完整 URL';
                    errorMsg.hidden = false;
                }
                results.hidden = true;
                return;
            }
            errorMsg.hidden = true;

            // 把协议分隔符 "://" 替换成 "/"（replace 只替换第一次出现，
            // 避免 URL 中再次出现 ":/"（如 ?redirect=http://... ）时链接被截断）
            const path = inputVal.replace('://', '/');
            directLink.textContent = `${location.origin}/${path}`;
            enhancedLink.textContent = `${location.origin}/api/proxy/${path}`;
            directOpen.href = directLink.textContent;
            enhancedOpen.href = enhancedLink.textContent;
            results.hidden = false;
        }

        // 输入即生成；回车/按钮同样触发（此时才提示错误）
        input.addEventListener('input', () => generate(false));
        form.addEventListener('submit', (event) => {
            event.preventDefault();
            generate(true);
        });

        // 复制按钮（clipboard API，file:// 等非安全上下文退回 execCommand）
        document.querySelectorAll('.copyBtn').forEach((btn) => {
            btn.addEventListener('click', async () => {
                const text = document.getElementById(btn.dataset.target).textContent;
                let ok = false;
                try {
                    await navigator.clipboard.writeText(text);
                    ok = true;
                } catch {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    try { ok = document.execCommand('copy'); } catch { ok = false; }
                    ta.remove();
                }
                btn.textContent = ok ? '已复制 ✓' : '复制失败';
                setTimeout(() => { btn.textContent = '复制'; }, 1500);
            });
        });

        input.focus();
    </script>
</body>
</html>
